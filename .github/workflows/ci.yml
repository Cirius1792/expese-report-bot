name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Install Liquibase
        run: |
          docker pull liquibase/liquibase:4.33.0
          sudo cp scripts/liquibase /usr/local/bin/liquibase
          sudo chmod +x /usr/local/bin/liquibase
      - name: Run unit tests
        run: uv run pytest -o addopts="" --cov=expense_report
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true

  bdd-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Install Liquibase
        run: |
          docker pull liquibase/liquibase:4.33.0
          sudo cp scripts/liquibase /usr/local/bin/liquibase
          sudo chmod +x /usr/local/bin/liquibase
      - name: Run BDD tests
        run: uv run behave

  generate-badge:
    runs-on: ubuntu-latest
    needs: bdd-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
      - name: Generate coverage badge
        run: |
          # coverage-badge imports pkg_resources (removed from setuptools>=81),
          # so pin setuptools<81 — uv installs setuptools 84 by default.
          pip install "coverage-badge" "setuptools<81"
          coverage-badge -o coverage.svg -f
      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: update coverage badge"
          file_pattern: coverage.svg
