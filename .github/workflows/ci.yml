name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      upload-coverage: true
    # Test code runs with a read-only token (the default can be read-write).
    permissions:
      contents: read
    # Cancel superseded runs on the same ref so rapid pushes do not pile up.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

  generate-badge:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
      - name: Generate coverage badge
        run: |
          # coverage-badge imports pkg_resources (removed from setuptools>=81),
          # so pin setuptools<81 — uv installs setuptools 84 by default.
          pip install "coverage-badge" "setuptools<81"
          coverage-badge -o coverage.svg -f
      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: update coverage badge"
          file_pattern: coverage.svg
